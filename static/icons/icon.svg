<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Candlestick Accents -->
  <g opacity="0.4">
    <!-- Candle 1 -->
    <line x1="150" y1="210" x2="150" y2="340" stroke="#10b981" stroke-width="3"/>
    <rect x="142" y="240" width="16" height="70" rx="3" fill="#10b981"/>
    <!-- Candle 2 -->
    <line x1="220" y1="180" x2="220" y2="310" stroke="#f43f5e" stroke-width="3"/>
    <rect x="212" y="210" width="16" height="60" rx="3" fill="#f43f5e"/>
    <!-- Candle 3 -->
    <line x1="330" y1="140" x2="330" y2="280" stroke="#10b981" stroke-width="3"/>
    <rect x="322" y="160" width="16" height="85" rx="3" fill="#10b981"/>
  </g>

  <!-- Synthetic Future Breakout Vector -->
  <path d="M 85 375 L 185 295 L 285 330 L 415 135"
        fill="none"
        stroke="url(#strokeGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Vertex Dots -->
  <circle cx="85" cy="375" r="10" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="185" cy="295" r="10" fill="#ffffff" stroke="#06b6d4" stroke-width="5"/>
  <circle cx="285" cy="330" r="10" fill="#ffffff" stroke="#10b981" stroke-width="5"/>

  <!-- Arrow Head Tip -->
  <polygon points="435,115 385,130 405,170 420,150"
           fill="#10b981"
           filter="url(#glow)"/>
  <circle cx="430" cy="120" r="6" fill="#ffffff"/>

  <!-- Brand Typography Sub-label -->
  <text x="256" y="445"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="6"
        fill="#f8fafc"
        text-anchor="middle">ZEROSYN</text>
</svg>
